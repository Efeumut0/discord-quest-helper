name: Bug report
description: Report a reproducible problem with Discord Quest Helper.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows and Discord versions
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game and source
      description: Include the game name and Source 1 or Source 2.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots
      description: Remove tokens, account information and personal paths.
