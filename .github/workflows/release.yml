name: Publish Windows release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-win
            src-tauri
      - name: Enable package manager
        run: corepack enable
      - name: Prepare dated release
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api 'repos/${{ github.repository }}/releases?per_page=100' > "$env:RUNNER_TEMP/releases.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh api 'repos/${{ github.repository }}/tags?per_page=100' > "$env:RUNNER_TEMP/tags.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/release.mjs prepare --releases "$env:RUNNER_TEMP/releases.json" --tags "$env:RUNNER_TEMP/tags.json" --info "$env:RUNNER_TEMP/release-info.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-win/Cargo.toml src-win/Cargo.lock src-win/embed_icon.rc
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) { git commit -m 'Set dated release version' }
      - name: Test and build signed setup
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/build.ps1 -OutputDirectory "$env:RUNNER_TEMP/release"
      - name: Generate updater manifest and checksums
        shell: pwsh
        run: node scripts/release.mjs package --artifacts "$env:RUNNER_TEMP/release" --info "$env:RUNNER_TEMP/release-info.json"
      - name: Upload complete package
        uses: actions/upload-artifact@v4
        with:
          name: DiscordQuestHelper-${{ steps.version.outputs.version }}-setup
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_DATE: ${{ steps.version.outputs.date }}
        run: |
          git tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push --atomic origin HEAD:main $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @(Get-ChildItem "$env:RUNNER_TEMP/release" -File | Where-Object Name -ne 'release-notes.md' | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @files --verify-tag --draft --title "Discord Quest Helper - $env:RELEASE_DATE" --notes-file "$env:RUNNER_TEMP/release/release-notes.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
