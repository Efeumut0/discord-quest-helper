[package]
name = "discord-quest-helper"
version = "2026.11.2701"
description = "Discord Quest Helper"
authors = ["efeumut"]
edition = "2021"

[lib]
# Keep the library name distinct from the Windows executable.
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2.7.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
discord-sdk = "0.4.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = "1.44.2"
once_cell = "1.21.3"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2.8.4"
reqwest = { version = ">=0.11, <0.12", features = ["json", "multipart", "brotli", "gzip", "blocking"] }
regex = "1"
time = { version = "0.3", features = ["parsing"] }
tauri-plugin-updater = "2.14.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
base64 = "0.23.1"
minisign-verify = "0.3"
