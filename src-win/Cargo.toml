[package]
name = "src-win"
version = "2026.11.2603"
edition = "2021"

[dependencies]
tray-icon = { version = "0.11" }
discord-sdk = "0.4.0"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Globalization",
]

[build-dependencies]
embed-resource = "3.0.6"

[[bin]]
name = "src-win"
path = "src/main.rs"

[profile.release]
opt-level = "z"       # Optimize for size
lto = true            # Enable Link Time Optimization
codegen-units = 1     # Reduce parallel code generation units to increase optimization
panic = "unwind"      # Enable stack unwinding for proper RAII cleanup on panic
strip = true          # Strip symbols from binary
overflow-checks = true   # Enable overflow checks for safety
debug = false           # No debug info
rpath = false           # Disable rpath

[profile.release.package."*"]
opt-level = "z"         # Apply size optimization to all dependencies
